<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donde los Grios — Cuadre de Caja</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0e1117;--sur:#161b24;--sur2:#1e2433;--bdr:#252d3d;--acc:#f5a623;--grn:#22c55e;--red:#ef4444;--blue:#3b82f6;--txt:#eef0f5;--mut:#6b7280;--r:14px;--rs:9px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Nunito',sans-serif;min-height:100vh}
/* PIN */
#pin-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at top,#1e2235,var(--bg) 70%)}
.pin-logo{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:var(--acc);text-align:center;letter-spacing:2px}
.pin-sub{font-size:.85rem;color:var(--mut);text-align:center;margin-bottom:28px}
.pin-disp{background:var(--sur);border:2px solid var(--bdr);border-radius:var(--r);padding:14px 24px;width:100%;max-width:280px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:10px;color:var(--txt);margin-bottom:8px;min-height:64px;transition:border-color .2s}
.pin-disp.err{border-color:var(--red);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-hint{color:var(--mut);font-size:.75rem;margin-bottom:22px;text-align:center;min-height:18px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.pk{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rs);padding:15px;font-size:1.4rem;font-weight:700;cursor:pointer;color:var(--txt);text-align:center;user-select:none;transition:all .12s}
.pk:active{background:var(--acc);color:#000;transform:scale(.92)}
.pk.del{background:transparent;color:var(--red)}
.pk.ok{background:var(--acc);color:#000;font-weight:800}
/* HEADER */
header{background:var(--sur);border-bottom:2px solid var(--acc);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-logo{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--acc);letter-spacing:1px}
.hdr-sub{font-size:.68rem;color:var(--mut)}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-time{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--mut);letter-spacing:1px}
.btn-logout{background:var(--sur2);border:1px solid var(--bdr);border-radius:var(--rs);padding:6px 14px;font-size:.78rem;font-weight:700;color:var(--mut);cursor:pointer;font-family:'Nunito',sans-serif}
/* CONTENT */
.container{max-width:900px;margin:0 auto;padding:20px 16px}
.filtros{background:var(--sur);border-radius:var(--r);padding:18px;margin-bottom:20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.f-group{display:flex;flex-direction:column;gap:6px;flex:1;min-width:140px}
.f-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}
.f-input{background:var(--sur2);border:1.5px solid var(--bdr);border-radius:var(--rs);padding:9px 12px;color:var(--txt);font-family:'Nunito',sans-serif;font-size:.9rem;outline:none;width:100%}
.f-input:focus{border-color:var(--acc)}
.btn-buscar{background:var(--acc);color:#000;border:none;border-radius:var(--rs);padding:10px 22px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.9rem;cursor:pointer;white-space:nowrap;height:38px}
.btn-export{background:var(--grn);color:#000;border:none;border-radius:var(--rs);padding:10px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;cursor:pointer;white-space:nowrap;height:38px;display:none}
.btn-export.on{display:block}
.resumen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.res-card{background:var(--sur);border-radius:var(--r);padding:16px;border-left:4px solid var(--bdr)}
.res-card.grn{border-color:var(--grn)}.res-card.blue{border-color:var(--blue)}.res-card.red{border-color:var(--red)}.res-card.acc{border-color:var(--acc)}.res-card.pur{border-color:#a855f7}
.res-lbl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:6px}
.res-val{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;line-height:1}
.res-val.grn{color:var(--grn)}.res-val.blue{color:var(--blue)}.res-val.red{color:var(--red)}.res-val.acc{color:var(--acc)}.res-val.pur{color:#a855f7}
.tabla-wrap{background:var(--sur);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.tabla-hdr{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.tabla-tit{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:.5px}
.tabla-cnt{font-size:.78rem;color:var(--mut);font-weight:600}
table{width:100%;border-collapse:collapse}
thead th{background:var(--sur2);padding:10px 14px;text-align:left;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--bdr)}
tbody tr:hover{background:var(--sur2)}
tbody tr:last-child{border-bottom:none}
tbody td{padding:10px 14px;font-size:.85rem}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:800}
.tag-ef{background:#22c55e22;color:var(--grn)}
.tag-tar{background:#3b82f622;color:var(--blue)}
.mesa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;padding:14px}
.mesa-card{background:var(--sur2);border-radius:var(--r);padding:14px;border:1px solid var(--bdr)}
.mesa-nombre{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--acc);margin-bottom:6px}
.mesa-row{display:flex;justify-content:space-between;font-size:.8rem;padding:2px 0}
.empty-state{text-align:center;padding:48px 20px;color:var(--mut)}
.empty-ico{font-size:3rem;opacity:.3;margin-bottom:12px}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-logo">Donde los Grios</div>
  <div class="pin-sub">Cuadre de Caja — Solo el dueño</div>
  <div class="pin-disp" id="pin-disp">_</div>
  <div class="pin-hint" id="pin-hint">Ingresa el PIN de acceso</div>
  <div class="pin-grid">
    <div class="pk" onclick="pk('1')">1</div><div class="pk" onclick="pk('2')">2</div><div class="pk" onclick="pk('3')">3</div>
    <div class="pk" onclick="pk('4')">4</div><div class="pk" onclick="pk('5')">5</div><div class="pk" onclick="pk('6')">6</div>
    <div class="pk" onclick="pk('7')">7</div><div class="pk" onclick="pk('8')">8</div><div class="pk" onclick="pk('9')">9</div>
    <div class="pk del" onclick="pkDel()">⌫</div><div class="pk" onclick="pk('0')">0</div><div class="pk ok" onclick="pkOk()">✓</div>
  </div>
</div>

<header>
  <div>
    <div class="hdr-logo">📊 Cuadre de Caja — Donde los Grios</div>
    <div class="hdr-sub">Historial y reportes de ventas</div>
  </div>
  <div class="hdr-right">
    <div class="hdr-time" id="reloj"></div>
    <div class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</div>
  </div>
</header>

<div class="container">
  <div class="filtros">
    <div class="f-group"><div class="f-label">Fecha inicio</div><input type="date" class="f-input" id="fechaInicio"></div>
    <div class="f-group"><div class="f-label">Fecha fin</div><input type="date" class="f-input" id="fechaFin"></div>
    <button class="btn-buscar" onclick="buscar()">Buscar</button>
    <button class="btn-export on" id="btnExport" onclick="exportarExcel()" style="display:none">📥 Excel</button>
  </div>
  <div id="contenido">
    <div class="empty-state"><div class="empty-ico">📊</div><div>Selecciona fechas y presiona Buscar</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyDPjFVieeQHxrz97udHcCx1QR8w_vMPYS0",
  authDomain:"pos-restaurante-383b0.firebaseapp.com",
  databaseURL:"https://pos-restaurante-383b0-default-rtdb.firebaseio.com",
  projectId:"pos-restaurante-383b0"
});
var db = firebase.database();

var PIN_CORRECTO = '2511';
var pinBuf = '';
function pk(d){ if(pinBuf.length>=4)return; pinBuf+=d; updPin(); }
function pkDel(){ pinBuf=pinBuf.slice(0,-1); updPin(); document.getElementById('pin-hint').textContent='Ingresa el PIN de acceso'; document.getElementById('pin-disp').classList.remove('err'); }
function updPin(){ document.getElementById('pin-disp').textContent=pinBuf?pinBuf.replace(/./g,'●'):'_'; }
function pkOk(){
  if(!pinBuf)return;
  if(pinBuf===PIN_CORRECTO){
    document.getElementById('pin-screen').style.display='none';
  } else {
    document.getElementById('pin-disp').classList.add('err');
    document.getElementById('pin-hint').textContent='PIN incorrecto';
    pinBuf='';
    setTimeout(function(){ updPin(); document.getElementById('pin-disp').classList.remove('err'); document.getElementById('pin-hint').textContent='Ingresa el PIN de acceso'; },1000);
  }
}
function cerrarSesion(){
  document.getElementById('pin-screen').style.display='flex';
  pinBuf=''; updPin();
  document.getElementById('contenido').innerHTML='<div class="empty-state"><div class="empty-ico">📊</div><div>Selecciona fechas y presiona Buscar</div></div>';
  document.getElementById('btnExport').style.display='none';
}

function pad(n){ return n<10?'0'+n:''+n; }
setInterval(function(){
  var n=new Date();
  document.getElementById('reloj').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
},1000);

var hoy=new Date();
var hoyStr=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
document.getElementById('fechaInicio').value=hoyStr;
document.getElementById('fechaFin').value=hoyStr;

var datosActuales=[];

function fechaComp(f){
  var p=f.split('/');
  if(p.length!==3)return '';
  return p[2]+'-'+p[1]+'-'+p[0];
}

function buscar(){
  var ini=document.getElementById('fechaInicio').value;
  var fin=document.getElementById('fechaFin').value;
  if(!ini||!fin){alert('Selecciona ambas fechas');return;}
  document.getElementById('contenido').innerHTML='<div class="empty-state"><div>Cargando...</div></div>';
  document.getElementById('btnExport').style.display='none';
  db.ref('historial_caja').once('value',function(snap){
    var todos=[];
    snap.forEach(function(c){
      var d=c.val();
      var fc=fechaComp(d.fecha||'');
      if(fc>=ini&&fc<=fin) todos.push(d);
    });
    datosActuales=todos;
    if(!todos.length){
      document.getElementById('contenido').innerHTML='<div class="empty-state"><div class="empty-ico">🔍</div><div>No hay registros en ese rango de fechas</div></div>';
      return;
    }
    document.getElementById('btnExport').style.display='block';
    renderResultados(todos);
  });
}

function renderResultados(datos){
  var ef=0,tar=0,tot=0;
  var mesas={};
  datos.forEach(function(d){
    var sub=Number(d.subtotal)||0; tot+=sub;
    if(d.metodoPago==='Tarjeta') tar+=sub; else ef+=sub;
    if(!mesas[d.mesa]) mesas[d.mesa]={total:0,efectivo:0,tarjeta:0};
    mesas[d.mesa].total+=sub;
    if(d.metodoPago==='Tarjeta') mesas[d.mesa].tarjeta+=sub; else mesas[d.mesa].efectivo+=sub;
  });
  var com=tar*0.0483; var neto=tot-com;
  var html='<div class="resumen-grid">';
  html+=mkCard('Total Vendido','Q'+tot.toFixed(2),'acc');
  html+=mkCard('Efectivo','Q'+ef.toFixed(2),'grn');
  html+=mkCard('Tarjeta','Q'+tar.toFixed(2),'blue');
  html+=mkCard('Comisión 4.83%','Q'+com.toFixed(2),'red');
  html+=mkCard('Neto Recibido','Q'+neto.toFixed(2),'acc');
  html+=mkCard('Registros',datos.length+'','pur');
  html+='</div>';
  // Por mesa
  var mk=Object.keys(mesas).sort();
  if(mk.length){
    html+='<div class="tabla-wrap"><div class="tabla-hdr"><div class="tabla-tit">Por Mesa</div></div><div class="mesa-grid">';
    mk.forEach(function(m){
      var i=mesas[m];
      html+='<div class="mesa-card"><div class="mesa-nombre">'+m+'</div>'+
        '<div class="mesa-row"><span>Total</span><span>Q'+i.total.toFixed(2)+'</span></div>'+
        '<div class="mesa-row"><span style="color:var(--grn)">Efectivo</span><span>Q'+i.efectivo.toFixed(2)+'</span></div>'+
        '<div class="mesa-row"><span style="color:var(--blue)">Tarjeta</span><span>Q'+i.tarjeta.toFixed(2)+'</span></div>'+
        '</div>';
    });
    html+='</div></div>';
  }
  // Tabla detalle
  datos.sort(function(a,b){return (b.timestamp||0)-(a.timestamp||0);});
  html+='<div class="tabla-wrap"><div class="tabla-hdr"><div class="tabla-tit">Detalle</div><div class="tabla-cnt">'+datos.length+' registros</div></div>';
  html+='<div style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Mesa</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th>Método</th><th>Mesero</th></tr></thead><tbody>';
  datos.forEach(function(d){
    var isT=d.metodoPago==='Tarjeta';
    html+='<tr><td>'+d.fecha+'</td><td>'+d.hora+'</td><td><strong>'+d.mesa+'</strong></td><td>'+d.producto+'</td><td style="text-align:center">'+d.cantidad+'</td><td>Q'+Number(d.precio||0).toFixed(2)+'</td><td><strong>Q'+Number(d.subtotal||0).toFixed(2)+'</strong></td><td><span class="tag '+(isT?'tag-tar':'tag-ef')+'">'+d.metodoPago+'</span></td><td style="color:var(--mut)">'+d.mesero+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  document.getElementById('contenido').innerHTML=html;
}

function mkCard(lbl,val,cls){
  return '<div class="res-card '+cls+'"><div class="res-lbl">'+lbl+'</div><div class="res-val '+cls+'">'+val+'</div></div>';
}

function exportarExcel(){
  if(!datosActuales.length)return;
  var ini=document.getElementById('fechaInicio').value;
  var fin=document.getElementById('fechaFin').value;
  var ef=0,tar=0,tot=0;
  datosActuales.forEach(function(d){var sub=Number(d.subtotal)||0;tot+=sub;if(d.metodoPago==='Tarjeta')tar+=sub;else ef+=sub;});
  var com=tar*0.0483;
  var resumen=[
    {'Concepto':'Período','Valor':ini+' al '+fin},
    {'Concepto':'Total Vendido','Valor':tot},
    {'Concepto':'Efectivo','Valor':ef},
    {'Concepto':'Tarjeta','Valor':tar},
    {'Concepto':'Comisión Tarjeta (4.83%)','Valor':com},
    {'Concepto':'Neto Recibido','Valor':tot-com},
    {'Concepto':'Total Registros','Valor':datosActuales.length}
  ];
  var detalle=datosActuales.map(function(d){return{'Fecha':d.fecha||'','Hora':d.hora||'','Mesa':d.mesa||'','Producto':d.producto||'','Cantidad':d.cantidad||0,'Precio Unitario':Number(d.precio||0),'Subtotal':Number(d.subtotal||0),'Método de Pago':d.metodoPago||'Efectivo','Mesero':d.mesero||'','Comentario':d.comentario||''};});
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(resumen),'Resumen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detalle),'Detalle');
  XLSX.writeFile(wb,'Cuadre_'+ini+'_al_'+fin+'.xlsx');
}
</script>
</body>
</html>
