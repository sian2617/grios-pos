<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Donde los Grillos — Cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f0a;--surface:#111a11;--surface2:#182018;--border:#1f2e1f;--accent:#22c55e;--danger:#ef4444;--warn:#f5a623;--text:#eef5ee;--muted:#5a7a5a;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh}
/* PIN */
#pin-screen{position:fixed;inset:0;background:#0a0f0a;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:radial-gradient(ellipse at top,#0d1f0d,#0a0f0a 70%)}
.pin-logo{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;color:#22c55e;text-align:center;letter-spacing:2px}
.pin-sub{font-size:.85rem;color:#5a7a5a;text-align:center;margin-bottom:28px}
.pin-disp{background:#111a11;border:2px solid #1f2e1f;border-radius:14px;padding:14px 24px;width:100%;max-width:280px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:10px;color:#eef5ee;margin-bottom:8px;min-height:64px;transition:border-color .2s}
.pin-disp.err{border-color:#ef4444;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pin-hint{color:#5a7a5a;font-size:.75rem;margin-bottom:22px;text-align:center;min-height:18px}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.pk{background:#182018;border:1px solid #1f2e1f;border-radius:9px;padding:15px;font-size:1.4rem;font-weight:700;cursor:pointer;color:#eef5ee;text-align:center;user-select:none;transition:all .12s}
.pk:active{background:#22c55e;color:#000;transform:scale(.92)}
.pk.del{background:transparent;color:#ef4444}
.pk.ok{background:#22c55e;color:#000;font-weight:800}
/* HEADER */
header{background:var(--surface);border-bottom:3px solid var(--accent);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px #22c55e22}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--accent);letter-spacing:3px}
.hdr-sub{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:-2px}
.badge{background:var(--accent);color:#000;font-weight:800;font-size:.85rem;padding:5px 16px;border-radius:999px}
.hdr-time{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--muted);letter-spacing:1px}
.btn-logout{background:#182018;border:1px solid #1f2e1f;border-radius:9px;padding:6px 14px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;font-family:'Nunito',sans-serif}
/* KDS */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:12px}
.empty-ico{font-size:5rem;opacity:.2}
.empty-txt{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;color:var(--accent);opacity:.3}
.empty-sub{color:var(--muted);font-size:.85rem;opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:16px}
.kcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);overflow:hidden;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.kcard.urgent{border-color:var(--danger);box-shadow:0 0 20px #ef444422}
.card-hdr{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-mesa{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:1px;color:var(--accent)}
.card-mesa.urgent{color:var(--danger)}
.card-right{display:flex;align-items:center;gap:8px}
.card-hora{font-size:.75rem;color:var(--muted);font-weight:700}
.card-age{font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px}
.age-ok{background:#22c55e22;color:var(--accent)}
.age-warn{background:#f5a62322;color:var(--warn)}
.age-hot{background:#ef444422;color:var(--danger)}
.card-items{padding:10px 16px}
.citem{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.citem:last-child{border-bottom:none}
.cqty{background:var(--accent);color:#000;font-family:'Bebas Neue',sans-serif;font-size:1rem;width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
.citem.urgent .cqty{background:var(--danger);color:#fff}
.cname{font-weight:700;font-size:.9rem}
.cnote{font-size:.75rem;color:#fca5a5;margin-top:2px}
.card-footer{padding:10px 16px 14px}
.btn-listo{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;padding:14px;font-family:'Nunito',sans-serif;font-weight:900;font-size:1rem;cursor:pointer;letter-spacing:.3px}
.btn-listo:disabled{opacity:.5;cursor:default}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2a1a;border:1px solid var(--accent);color:var(--accent);padding:10px 24px;border-radius:999px;font-size:.85rem;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- PIN -->
<div id="pin-screen">
  <div class="pin-logo">Donde los Grillos</div>
  <div class="pin-sub">Panel de Cocina — Acceso restringido</div>
  <div class="pin-disp" id="pin-disp">_</div>
  <div class="pin-hint" id="pin-hint">Ingresa el PIN de acceso</div>
  <div class="pin-grid">
    <div class="pk" onclick="pk('1')">1</div><div class="pk" onclick="pk('2')">2</div><div class="pk" onclick="pk('3')">3</div>
    <div class="pk" onclick="pk('4')">4</div><div class="pk" onclick="pk('5')">5</div><div class="pk" onclick="pk('6')">6</div>
    <div class="pk" onclick="pk('7')">7</div><div class="pk" onclick="pk('8')">8</div><div class="pk" onclick="pk('9')">9</div>
    <div class="pk del" onclick="pkDel()">⌫</div><div class="pk" onclick="pk('0')">0</div><div class="pk ok" onclick="pkOk()">✓</div>
  </div>
</div>

<header>
  <div class="hdr-left">
    <div>
      <div class="hdr-title">COCINA</div>
      <div class="hdr-sub">Donde los Grillos</div>
    </div>
    <div class="badge" id="badge">0 pedidos</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="hdr-time" id="reloj"></div>
    <div class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</div>
  </div>
</header>

<div id="cont"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDPjFVieeQHxrz97udHcCx1QR8w_vMPYS0",
  databaseURL: "https://pos-restaurante-383b0-default-rtdb.firebaseio.com",
  projectId: "pos-restaurante-383b0"
});
var db = firebase.database();
var DESTINO = 'Cocina';
var PIN_CORRECTO = '2511';
var pinBuf = '';

function pk(d){ if(pinBuf.length>=4)return; pinBuf+=d; updPin(); }
function pkDel(){ pinBuf=pinBuf.slice(0,-1); updPin(); document.getElementById('pin-hint').textContent='Ingresa el PIN de acceso'; document.getElementById('pin-disp').classList.remove('err'); }
function updPin(){ document.getElementById('pin-disp').textContent=pinBuf?pinBuf.replace(/./g,'●'):'_'; }
function pkOk(){
  if(!pinBuf)return;
  if(pinBuf===PIN_CORRECTO){
    document.getElementById('pin-screen').style.display='none';
  } else {
    document.getElementById('pin-disp').classList.add('err');
    document.getElementById('pin-hint').textContent='PIN incorrecto';
    pinBuf='';
    setTimeout(function(){ updPin(); document.getElementById('pin-disp').classList.remove('err'); document.getElementById('pin-hint').textContent='Ingresa el PIN de acceso'; },1000);
  }
}
function cerrarSesion(){
  document.getElementById('pin-screen').style.display='flex';
  pinBuf=''; updPin();
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }
setInterval(function() {
  var n = new Date();
  document.getElementById('reloj').textContent = pad(n.getHours()) + ':' + pad(n.getMinutes()) + ':' + pad(n.getSeconds());
}, 1000);

db.ref('comandas').on('value', function(snap) {
  var mesas = {};
  snap.forEach(function(c) {
    var d = c.val();
    if (!d || d.destino !== DESTINO || d.estado !== 'Pendiente') return;
    var mesa = d.mesa;
    if (!mesas[mesa]) mesas[mesa] = { mesa: mesa, hora: d.timestamp, items: [], ids: [] };
    mesas[mesa].items.push({ producto: d.producto, cantidad: d.cantidad, comentario: d.comentario || '' });
    mesas[mesa].ids.push(c.key);
    if (d.timestamp < mesas[mesa].hora) mesas[mesa].hora = d.timestamp;
  });
  render(Object.values(mesas));
});

function render(mesas) {
  var cont = document.getElementById('cont');
  var badge = document.getElementById('badge');
  badge.textContent = mesas.length + (mesas.length === 1 ? ' pedido' : ' pedidos');
  if (!mesas.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-ico">✓</div><div class="empty-txt">Todo listo</div><div class="empty-sub">No hay pedidos pendientes</div></div>';
    return;
  }
  mesas.sort(function(a, b) { return a.hora - b.hora; });
  var grid = document.createElement('div');
  grid.className = 'grid';
  mesas.forEach(function(m) {
    var mins = Math.floor((Date.now() - m.hora) / 60000);
    var ageClass = mins >= 15 ? 'age-hot' : mins >= 8 ? 'age-warn' : 'age-ok';
    var ageTxt = mins < 1 ? 'Ahora' : mins + 'min';
    var urgent = mins >= 15;
    var hora = new Date(m.hora);
    var horaTxt = pad(hora.getHours()) + ':' + pad(hora.getMinutes());
    var card = document.createElement('div');
    card.className = 'kcard' + (urgent ? ' urgent' : '');
    var hdr = document.createElement('div');
    hdr.className = 'card-hdr';
    hdr.innerHTML = '<div class="card-mesa' + (urgent ? ' urgent' : '') + '">' + m.mesa + '</div>' +
      '<div class="card-right"><div class="card-hora">' + horaTxt + '</div><div class="card-age ' + ageClass + '">' + ageTxt + '</div></div>';
    card.appendChild(hdr);
    var itemsDiv = document.createElement('div');
    itemsDiv.className = 'card-items';
    m.items.forEach(function(i) {
      var row = document.createElement('div');
      row.className = 'citem' + (urgent ? ' urgent' : '');
      var qty = document.createElement('div');
      qty.className = 'cqty';
      qty.textContent = i.cantidad;
      var info = document.createElement('div');
      var name = document.createElement('div');
      name.className = 'cname';
      name.textContent = i.producto;
      info.appendChild(name);
      if (i.comentario) {
        var note = document.createElement('div');
        note.className = 'cnote';
        note.textContent = '📝 ' + i.comentario;
        info.appendChild(note);
      }
      row.appendChild(qty);
      row.appendChild(info);
      itemsDiv.appendChild(row);
    });
    card.appendChild(itemsDiv);
    var footer = document.createElement('div');
    footer.className = 'card-footer';
    var btn = document.createElement('button');
    btn.className = 'btn-listo';
    btn.textContent = 'LISTO';
    var savedIds = m.ids.slice();
    btn.onclick = function() {
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      var updates = {};
      savedIds.forEach(function(id) { updates['comandas/' + id + '/estado'] = 'Listo'; });
      db.ref().update(updates, function(error) {
        if (error) {
          btn.disabled = false;
          btn.textContent = 'LISTO';
          toast('Error: ' + error.message);
        } else {
          card.style.opacity = '0';
          card.style.transform = 'scale(0.9)';
          card.style.transition = 'all 0.3s';
          setTimeout(function() { if (card.parentNode) card.parentNode.removeChild(card); }, 300);
          toast('Pedido entregado');
        }
      });
    };
    footer.appendChild(btn);
    card.appendChild(footer);
    grid.appendChild(card);
  });
  cont.innerHTML = '';
  cont.appendChild(grid);
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function() { t.classList.remove('on'); }, 2500);
}
</script>
</body>
</html>
